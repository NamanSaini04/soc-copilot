[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-soc-copilot"
version = "0.1.0"
description = "Defensive, evidence-grounded SOC investigation copilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
  "plotly>=5.24,<7",
  "matplotlib>=3.9,<4",
  "reportlab>=4.2,<5",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6", "faiss-cpu>=1.8,<2"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "pypdf>=5,<7", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "agents*", "rag*", "reports*", "mcp_servers*"]
exclude = ["data*", "dashboard*", "evaluation*", "knowledge_base*", "tests*", "tmp*"]
